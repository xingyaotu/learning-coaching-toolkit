name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JSON 文件格式验证
        run: |
          echo "=== JSON 格式验证 ==="
          ERROR=0
          while IFS= read -r -d '' f; do
            echo -n "Checking: $f ... "
            if python3 -c "import json,sys; json.load(open('$f'))" 2>&1; then
              echo "✅"
            else
              echo "❌ Invalid JSON: $f"
              ERROR=1
            fi
          done < <(find . -name "*.json" -not -path "./.github/*" -print0)
          [ $ERROR -eq 0 ] || exit 1

      - name: 道层漂移关键词检测（精准模式）
        run: |
          echo "=== 道层漂移关键词检测（仅扫工程目录）==="
          # 仅扫 pipeline-data/ .github/ — 不扫 coaching-sops/
          # coaching-sops/ 是SOP权威定义库，守护文件在合规说明中以反例引用禁词，
          # 属正当用途；结构化校验由下方专项步骤承担。
          SCAN_DIRS=""
          for d in pipeline-data .github; do
            [ -d "$d" ] && SCAN_DIRS="$SCAN_DIRS $d"
          done

          if [ -z "$SCAN_DIRS" ]; then
            echo "⚠️  无可扫目录，跳过"
            exit 0
          fi

          # 精准正则（与 xingyaotu-openmaic/.dao-guard.sh v5.1 对齐）
          DRIFT_05='导入.*拆解.*讲解.*类比.*演示.*练习.*反馈.*巩固|⑤[[:space:]]*演示|第五步[[:space:]]*演示'
          DRIFT_06='F-错题|F-笔记|F-阅读|F-实践|错题飞轮|笔记飞轮|阅读飞轮|实践飞轮'

          ERROR=0
          for PAT in "$DRIFT_05" "$DRIFT_06"; do
            HIT=$(grep -rnE "$PAT" \
              --include="*.md" --include="*.json" --include="*.yml" --include="*.yaml" \
              --exclude-dir=".git" \
              $SCAN_DIRS 2>/dev/null \
              || true)
            if [ -n "$HIT" ]; then
              echo "❌ 道层漂移检测到:"
              echo "$HIT"
              ERROR=1
            fi
          done

          [ $ERROR -eq 0 ] && echo "✅ 道层漂移检查 0 命中"
          [ $ERROR -eq 0 ] || exit 1

      - name: 八步⑤=流程 守护
        run: |
          echo "=== 八步第5步守护：⑤=流程（绝非演示）==="
          if [ -f pipeline-data/tool-catalog.json ]; then
            python3 - <<'EOF'
import json, sys
with open('pipeline-data/tool-catalog.json') as f:
    data = json.load(f)
tools = data.get('tools', data.get('items', []))
errors = []
for t in tools:
    steps = t.get('eight_steps', [])
    if len(steps) >= 5:
        step5 = steps[4] if isinstance(steps[4], str) else steps[4].get('name', '')
        if '演示' in step5:
            errors.append(f"❌ Tool {t.get('id','?')}: step5='{step5}' contains 演示")
if errors:
    for e in errors: print(e)
    sys.exit(1)
print('✅ 八步⑤=流程 守护通过')
EOF
          else
            echo "⚠️  pipeline-data/tool-catalog.json not found, skipping"
          fi

      - name: 六飞轮完整性
        run: |
          echo "=== 六飞轮完整性：无错题/笔记/阅读/实践 ==="
          python3 - <<'EOF'
import json, glob, sys
BAD = ['错题飞轮', '笔记飞轮', '阅读飞轮', '实践飞轮', 'F-错题', 'F-笔记', 'F-阅读', 'F-实践']
found_bad = []
for pattern in ['pipeline-data/**/*.json']:
    for f in glob.glob(pattern, recursive=True):
        try:
            text = open(f).read()
            for bad in BAD:
                if bad in text:
                    found_bad.append(f"{f}: contains '{bad}'")
        except Exception:
            pass
if found_bad:
    print('❌ 非法飞轮词检测:')
    for e in found_bad: print(e)
    sys.exit(1)
print('✅ 六飞轮完整性通过（无错题/笔记/阅读/实践）')
EOF
