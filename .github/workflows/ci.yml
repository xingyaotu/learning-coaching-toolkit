name: 道层守护 + SOP 验证

on:
  push:
    branches: [main, 'claude/*']
  pull_request:
    branches: [main]

jobs:
  dao-guard:
    name: 道层零漂移 6 项 grep 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "[1/6] 禁止漂移术语: 导入|拆解|讲解|类比|演示"
        run: |
          # Scope to controlled data dirs only; pre-existing knowledge-base docs excluded
          HITS=0
          for DIR in pipeline-data coaching-sops; do
            if [ -d "$DIR" ]; then
              COUNT=$(grep -rn "导入\|拆解\|讲解\|类比\|演示" \
                --include="*.md" --include="*.json" \
                "$DIR" 2>/dev/null | wc -l)
              HITS=$((HITS + COUNT))
            fi
          done
          echo "Drift term hits in controlled dirs: $HITS"
          [ "$HITS" -eq 0 ]

      - name: "[2/6] 禁止 JUMEQ 英语漂移: Judge|Understand|Match|Execute|Qualify"
        run: |
          HITS=0
          for DIR in pipeline-data coaching-sops; do
            if [ -d "$DIR" ]; then
              COUNT=$(grep -rn "\bJudge\b\|\bUnderstand\b\|\bMatch\b\|\bExecute\b\|\bQualify\b" \
                --include="*.md" --include="*.json" \
                "$DIR" 2>/dev/null | wc -l)
              HITS=$((HITS + COUNT))
            fi
          done
          echo "JUMEQ English drift hits: $HITS"
          [ "$HITS" -eq 0 ]

      - name: "[3/6] 禁止六飞轮替换元素: 错题|笔记|阅读|实践"
        run: |
          # Scope to coaching-sops only: flywheel-name replacement risk lives in SOP definitions.
          # Tool catalog (pipeline-data) may reference physical file names that contain these words.
          HITS=0
          if [ -d "coaching-sops" ]; then
            HITS=$(grep -rn "错题\|笔记\|阅读\|实践" \
              --include="*.md" --include="*.json" \
              "coaching-sops" 2>/dev/null | wc -l)
          fi
          echo "Flywheel replacement hits in coaching-sops: $HITS"
          [ "$HITS" -eq 0 ]

      - name: "[4/6] FIRE-UP 必须为 6 字母(F/I/R/E/U/P)"
        run: |
          FIVE_LETTER=0
          for DIR in pipeline-data coaching-sops; do
            if [ -d "$DIR" ]; then
              COUNT=$(grep -rn "FIRE-UP" \
                --include="*.md" --include="*.json" \
                "$DIR" 2>/dev/null \
                | grep -v "F.*I.*R.*E.*U.*P" | wc -l)
              FIVE_LETTER=$((FIVE_LETTER + COUNT))
            fi
          done
          echo "FIRE-UP with missing letters: $FIVE_LETTER"
          [ "$FIVE_LETTER" -eq 0 ]

      - name: "[5/6] SOP_05 step 名称必须 = 流程"
        run: |
          WRONG=0
          for DIR in pipeline-data coaching-sops; do
            if [ -d "$DIR" ]; then
              COUNT=$(grep -rn "eight_step_name.*演示\|SOP_05.*演示" \
                --include="*.md" --include="*.json" \
                "$DIR" 2>/dev/null | wc -l)
              WRONG=$((WRONG + COUNT))
            fi
          done
          echo "SOP_05 step name drift: $WRONG"
          [ "$WRONG" -eq 0 ]
          if [ -f "coaching-sops/eight-step-sops/SOP_05-流程.md" ]; then
            echo "SOP_05-流程.md found ✅"
          else
            echo "WARNING: coaching-sops/eight-step-sops/SOP_05-流程.md not found"
          fi

      - name: "[6/6] CSO Secret 扫描: 禁止硬编码 API key"
        run: |
          SECRETS=$(grep -rn "sk-ant-\|ghp_\|AKIA[A-Z0-9]\|sk-[a-zA-Z0-9]\{20,\}" \
            --include="*.json" --include="*.ts" --include="*.py" \
            --include="*.sh" --exclude-dir=".git" . | wc -l)
          echo "Hardcoded secret hits: $SECRETS"
          [ "$SECRETS" -eq 0 ]

  json-and-sop-validate:
    name: JSON + SOP 完整性验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 验证所有 JSON 文件
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          errors = []
          for path in glob.glob('**/*.json', recursive=True):
              if '.git' in path:
                  continue
              try:
                  with open(path, encoding='utf-8') as f:
                      json.load(f)
              except Exception as e:
                  errors.append(f'{path}: {e}')
          if errors:
              for err in errors:
                  print(f'ERROR: {err}')
              sys.exit(1)
          count = len([p for p in glob.glob('**/*.json', recursive=True) if '.git' not in p])
          print(f'All {count} JSON files valid ✅')
          EOF

      - name: 验证 coaching-sops/index.json SOP 完整性
        run: |
          python3 - <<'EOF'
          import json, sys
          try:
              with open('coaching-sops/index.json', encoding='utf-8') as f:
                  index = json.load(f)
          except FileNotFoundError:
              print('coaching-sops/index.json not found, skipping')
              sys.exit(0)
          sops = index.get('eight_step_sops', []) + index.get('flywheel_sops', [])
          errors = []
          eight_step_names = ['穿透', '提取', '整理', '审题', '流程', '批改', '分析', '估分']
          for sop in index.get('eight_step_sops', []):
              sid = sop.get('sop_id', 'unknown')
              if sid == 'SOP_05' and sop.get('name_zh') != '流程':
                  errors.append(f'SOP_05 name_zh must be 流程, got: {sop.get("name_zh")}')
              step_id = sop.get('eight_step_id', 0)
              if step_id in range(1, 9):
                  expected = eight_step_names[step_id - 1]
                  if sop.get('name_zh') != expected:
                      errors.append(f'{sid}: step_id={step_id} expected {expected}, got {sop.get("name_zh")}')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)
          total = len(sops)
          print(f'SOP index validation passed: {total} SOPs ✅')
          print(f'SOP_05 = 流程 confirmed ✅')
          EOF
