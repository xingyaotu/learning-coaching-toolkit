name: 道层守护 + SOP 验证

on:
  push:
    branches: [main, 'claude/*']
  pull_request:
    branches: [main]

jobs:
  dao-guard:
    name: 道层零漂移 6 项 grep 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "[1/6] 禁止漂移术语: 导入|拆解|讲解|类比|演示"
        run: |
          HITS=$(grep -rn "导入\|拆解\|讲解\|类比\|演示" \
            --include="*.md" --include="*.json" --include="*.ts" --include="*.py" \
            --exclude-dir=".git" . \
            | grep -v "STATUS.md" | wc -l)
          echo "Drift term hits: $HITS"
          [ "$HITS" -eq 0 ]

      - name: "[2/6] 禁止 JUMEQ 英语漂移: Judge|Understand|Match|Execute|Qualify"
        run: |
          HITS=$(grep -rn "\bJudge\b\|\bUnderstand\b\|\bMatch\b\|\bExecute\b\|\bQualify\b" \
            --include="*.md" --include="*.json" \
            --exclude-dir=".git" . \
            | grep -v "STATUS.md" | wc -l)
          echo "JUMEQ English drift hits: $HITS"
          [ "$HITS" -eq 0 ]

      - name: "[3/6] 禁止六飞轮替换元素: 错题|笔记|阅读|实践"
        run: |
          HITS=$(grep -rn "错题\|笔记\|阅读\|实践" \
            --include="*.md" --include="*.json" \
            --exclude-dir=".git" . \
            | grep -v "STATUS.md" | grep -v "CLAUDE.md" | wc -l)
          echo "Flywheel replacement hits: $HITS"
          [ "$HITS" -eq 0 ]

      - name: "[4/6] FIRE-UP 必须为 6 字母(F/I/R/E/U/P)"
        run: |
          FIVE_LETTER=$(grep -rn "FIRE-UP" \
            --include="*.md" --include="*.json" \
            --exclude-dir=".git" . \
            | grep -v "F.*I.*R.*E.*U.*P" | wc -l)
          echo "FIRE-UP with missing letters: $FIVE_LETTER"
          [ "$FIVE_LETTER" -eq 0 ]

      - name: "[5/6] SOP_05 step 名称必须 = 流程"
        run: |
          # SOP_05 (eight_step_name) must be 流程, never 演示 or other drift
          WRONG=$(grep -rn "eight_step_name.*演示\|SOP_05.*演示" \
            --include="*.md" --include="*.json" \
            --exclude-dir=".git" . | wc -l)
          echo "SOP_05 step name drift: $WRONG"
          [ "$WRONG" -eq 0 ]
          # Verify SOP_05 exists and contains 流程
          if [ -f "coaching-sops/SOP_05-流程.md" ]; then
            echo "SOP_05-流程.md found ✅"
          else
            echo "WARNING: coaching-sops/SOP_05-流程.md not found"
          fi

      - name: "[6/6] CSO Secret 扫描: 禁止硬编码 API key"
        run: |
          SECRETS=$(grep -rn "sk-ant-\|ghp_\|AKIA[A-Z0-9]\|sk-[a-zA-Z0-9]\{20,\}" \
            --include="*.md" --include="*.json" --include="*.ts" --include="*.py" \
            --include="*.sh" --exclude-dir=".git" . | wc -l)
          echo "Hardcoded secret hits: $SECRETS"
          [ "$SECRETS" -eq 0 ]

  json-and-sop-validate:
    name: JSON + SOP 完整性验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 验证所有 JSON 文件
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          errors = []
          for path in glob.glob('**/*.json', recursive=True):
              if '.git' in path:
                  continue
              try:
                  with open(path, encoding='utf-8') as f:
                      json.load(f)
              except Exception as e:
                  errors.append(f'{path}: {e}')
          if errors:
              for err in errors:
                  print(f'ERROR: {err}')
              sys.exit(1)
          count = len([p for p in glob.glob('**/*.json', recursive=True) if '.git' not in p])
          print(f'All {count} JSON files valid ✅')
          EOF

      - name: 验证 coaching-sops/index.json SOP 完整性
        run: |
          python3 - <<'EOF'
          import json, sys
          try:
              with open('coaching-sops/index.json', encoding='utf-8') as f:
                  index = json.load(f)
          except FileNotFoundError:
              print('coaching-sops/index.json not found, skipping')
              sys.exit(0)
          sops = index if isinstance(index, list) else index.get('sops', [])
          errors = []
          eight_step_names = ['穿透', '提取', '整理', '审题', '流程', '批改', '分析', '估分']
          flywheel_names = ['计划', '预习', '复习', '听课', '作业', '考试']
          for sop in sops:
              sid = sop.get('sop_id', 'unknown')
              name = sop.get('eight_step_name', sop.get('flywheel_name', ''))
              # Validate step 5 specifically
              if sid == 'SOP_05' and name != '流程':
                  errors.append(f'SOP_05 eight_step_name must be 流程, got: {name}')
              # Validate eight-step SOPs
              if 'eight_step_name' in sop:
                  step_id = sop.get('step_id', 0)
                  if step_id in range(1, 9):
                      expected = eight_step_names[step_id - 1]
                      if sop['eight_step_name'] != expected:
                          errors.append(f'{sid}: step_id={step_id} expected {expected}, got {sop["eight_step_name"]}')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)
          print(f'SOP index validation passed: {len(sops)} SOPs ✅')
          print(f'SOP_05 = 流程 confirmed ✅')
          EOF
