name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          echo "=== JSON 格式验证 ==="
          ERROR=0
          while IFS= read -r -d '' f; do
            echo -n "Checking: $f ... "
            if python3 -c "import json,sys; json.load(open('$f'))" 2>&1; then
              echo "✅"
            else
              echo "❌ Invalid JSON: $f"
              ERROR=1
            fi
          done < <(find . -name "*.json" -not -path "./.github/*" -print0)
          [ $ERROR -eq 0 ] || exit 1

      - name: 道层漂移关键词检查
        run: |
          echo "=== 道层漂移关键词检查 ==="
          DRIFT=$(grep -rn \
            --include="*.json" \
            --include="*.md" \
            --exclude="CLAUDE.md" \
            --exclude="README.md" \
            --exclude-dir=".github" \
            -E "导入|拆解|讲解|类比|演示|Judge|Understand|Match|Execute|Qualify" \
            . 2>/dev/null || true)
          if [ -n "$DRIFT" ]; then
            echo "❌ 道层漂移词检测:"
            echo "$DRIFT"
            exit 1
          fi
          echo "✅ 道层漂移检查 0 命中"

      - name: 八步⑤=流程 守护
        run: |
          echo "=== 八步第5步守护：⑤=流程（绝非演示）==="
          if [ -f pipeline-data/tool-catalog.json ]; then
            python3 - <<'EOF'
import json, sys
with open('pipeline-data/tool-catalog.json') as f:
    data = json.load(f)
# Check eight_step entries: step 5 must be 流程, not 演示
tools = data.get('tools', data.get('items', []))
errors = []
for t in tools:
    steps = t.get('eight_steps', [])
    if len(steps) >= 5:
        step5 = steps[4] if isinstance(steps[4], str) else steps[4].get('name', '')
        if '演示' in step5:
            errors.append(f"❌ Tool {t.get('id','?')}: step5='{step5}' contains 演示")
        elif '流程' not in step5 and step5:
            pass  # Optional: warn if not exactly 流程
if errors:
    for e in errors: print(e)
    sys.exit(1)
print('✅ 八步⑤=流程 守护通过')
EOF
          else
            echo "⚠️  pipeline-data/tool-catalog.json not found, skipping step guard"
          fi

      - name: 六飞轮完整性
        run: |
          echo "=== 六飞轮完整性：计划/预习/复习/听课/作业/考试 ==="
          python3 - <<'EOF'
import json, glob, sys
FLYWHEELS = {'计划', '预习', '复习', '听课', '作业', '考试'}
BAD_FLYWHEELS = {'错题', '笔记', '阅读', '实践'}
found_bad = []
for f in glob.glob('**/*.json', recursive=True):
    if '.github' in f: continue
    try:
        with open(f) as fp:
            text = fp.read()
        for bad in BAD_FLYWHEELS:
            if bad in text:
                found_bad.append(f"{f}: contains '{bad}'")
    except:
        pass
if found_bad:
    print('❌ 非法飞轮词检测:')
    for e in found_bad: print(e)
    sys.exit(1)
print('✅ 六飞轮完整性通过（无错题/笔记/阅读/实践）')
EOF
