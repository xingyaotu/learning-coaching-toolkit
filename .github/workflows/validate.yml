name: Validate
# 道层 Compliance: v5.0 | JSON 验证 + 内容检查
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  json-validate:
    name: JSON 文件格式验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证 JSON 文件
        run: |
          FAIL=0
          for f in $(find . -name "*.json" -not -path "./.git/*"); do
            python3 -c "import json,sys; json.load(open('$f'))" 2>&1 && echo "✅ $f" || { echo "❌ $f"; FAIL=1; }
          done
          exit $FAIL

  content-check:
    name: 道层漂移关键词检测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检测道层漂移(6 类)
        run: |
          FAIL=0
          # 模式1: 八步第5步误用"演示" — 排除警示/负例上下文行
          HITS=$(grep -rE "⑤[[:space:]]*演示|第五步[[:space:]]*演示" \
            --include="*.md" --include="*.json" --exclude-dir=".git" . \
            | grep -v "均属道层漂移\|漂移错误\|不是演示\|绝不是\|禁止\|误用" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "❌ 道层漂移: 八步第5步不是演示"; FAIL=1
          else echo "✅ 八步第5步合规"; fi

          # 模式2: 六飞轮错误变体 — 排除警示/负例上下文行
          HITS=$(grep -rE "错题飞轮|笔记飞轮|阅读飞轮|实践飞轮" \
            --include="*.md" --include="*.json" --exclude-dir=".git" . \
            | grep -v "不是\|无\|禁止\|误用\|漂移" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "❌ 道层漂移: 六飞轮含非法变体"; FAIL=1
          else echo "✅ 六飞轮名称合规"; fi

          # 模式3: FIRE-UP 5字母误用
          HITS=$(grep -rE "Foundation.*Identity.*Roadmap.*Execute.*UP[^a-zA-Z]" \
            --include="*.md" --include="*.json" --exclude-dir=".git" . || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "❌ 道层漂移: FIRE-UP 应为6字母"; FAIL=1
          else echo "✅ FIRE-UP 6字母合规"; fi

          # 模式4: SOP_05 名称检查 — 排除负例上下文
          HITS=$(grep -rE "SOP_05.*演示|SOP.05.*demo" \
            --include="*.md" --include="*.json" --exclude-dir=".git" . \
            | grep -v "不是\|绝不\|绝非\|禁止\|漂移" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "❌ 道层漂移: SOP_05=流程不是演示"; FAIL=1
          else echo "✅ SOP_05 流程名称合规"; fi

          exit $FAIL
