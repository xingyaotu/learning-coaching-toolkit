name: Validate
# 道层 Compliance: v5.1 | JSON 验证 + 内容检查
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
jobs:
  json-validate:
    name: JSON 格式验证
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 验证所有 JSON 文件
        run: |
          find . -name '*.json' -not -path './.git/*' | while read f; do
            python3 -c "import json,sys; json.load(open('$f'))" || { echo "❌ $f"; exit 1; }
          done
          echo "✅ 所有 JSON 格式正确"
  content-check:
    name: 内容漂移检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 检查漂移词
        run: |
          FAIL=0
          for d in pipeline-data schemas coaching-sops docs; do
            [ -d "$d" ] || continue
            if grep -rEl '演示' "$d" --include='*.json' --include='*.md' 2>/dev/null | grep -q .; then
              echo "❌ 发现 '演示' 漂移词"
              FAIL=1
            fi
            if grep -rEl 'Mutually Exclusive' "$d" --include='*.json' --include='*.md' 2>/dev/null | grep -q .; then
              echo "❌ 发现 'Mutually Exclusive' 漂移词"
              FAIL=1
            fi
            if grep -rEl '错题飞轮|笔记飞轮|阅读飞轮|实践飞轮' "$d" --include='*.json' --include='*.md' 2>/dev/null | grep -q .; then
              echo "❌ 发现六飞轮漂移词"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "✅ 内容检查通过" || exit 1
