name: Validate
# 道层 Compliance: v5.23 | JSON 验证 + 内容检查 + SOP 完整性 + colleague-skill 接口 + Stage→SOP 路由矩阵 + 教练会话模板 + 跨数据一致性 + 目标 schema + 有效性指标 + 进度追踪 schema + 报告模板 schema + 干预手册验证 + 入学流程验证 + 质量保证 schema 验证 + 升级处置协议验证 + 同伴督导 schema 验证 + 认证等级 schema 验证 + 教练计划 schema 验证 + 家长参与 schema 验证 + 小组会话 schema 验证 + 毕业结案 schema 验证 + 脱落风险 schema 验证 + 会话笔记 schema 验证 + 复测触发 schema 验证 + 学生档案 schema 验证 + 平台分析 schema 验证
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  json-validate:
    name: JSON 文件格式验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证 JSON 文件
        run: |
          FAIL=0
          for f in $(find . -name "*.json" -not -path "./.git/*"); do
            python3 -c "import json,sys; json.load(open('$f'))" 2>&1 && echo "✅ $f" || { echo "❌ $f"; FAIL=1; }
          done
          exit $FAIL

  content-check:
    name: 道层漂移关键词检测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检测道层漂移(6 类)
        run: |
          FAIL=0
          # 模式1: 八步第5步误用"演示"
          if grep -rE "⑤[[:space:]]*演示|第五步[[:space:]]*演示" --include="*.md" --include="*.json" \
             --exclude-dir=".git" .; then
            echo "❌ 道层漂移: 八步第5步不是演示"; FAIL=1
          else echo "✅ 八步第5步合规"; fi

          # 模式2: 六飞轮错误变体
          if grep -rE "错题飞轮|笔记飞轮|阅读飞轮|实践飞轮" --include="*.md" --include="*.json" \
             --exclude-dir=".git" .; then
            echo "❌ 道层漂移: 六飞轮含非法变体"; FAIL=1
          else echo "✅ 六飞轮名称合规"; fi

          # 模式3: FIRE-UP 5字母误用
          if grep -rE "Foundation.*Identity.*Roadmap.*Execute.*UP[^a-zA-Z]" --include="*.md" --include="*.json" \
             --exclude-dir=".git" .; then
            echo "❌ 道层漂移: FIRE-UP 应为6字母"; FAIL=1
          else echo "✅ FIRE-UP 6字母合规"; fi

          # 模式4: SOP_05 名称检查
          if grep -rE "SOP_05.*演示|SOP.05.*demo" --include="*.md" --include="*.json" \
             --exclude-dir=".git" .; then
            echo "❌ 道层漂移: SOP_05=流程不是演示"; FAIL=1
          else echo "✅ SOP_05 流程名称合规"; fi

          exit $FAIL

  sop-completeness:
    name: SOP 完整性验证(14个SOP + ⑤流程)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行 SOP 完整性验证脚本
        run: python3 scripts/validate-sop-completeness.py

  colleague-skills:
    name: colleague-skill SKILL.md 接口验证(14个 + ⑤守护)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 PyYAML
        run: pip install pyyaml --quiet
      - name: 运行 colleague-skill 验证脚本
        run: python3 scripts/validate-colleague-skills.py

  stage-routing:
    name: Stage→SOP 路由矩阵验证(七阶×飞轮×八步 合规)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行 Stage→SOP 路由验证脚本
        run: python3 scripts/validate-stage-routing.py

  session-templates:
    name: 教练会话模板验证(14模板 + ⑤守护 + skill接口路径)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练会话模板验证脚本
        run: python3 scripts/validate-session-templates.py

  cross-routing:
    name: 跨数据一致性验证(routing ↔ templates ↔ catalog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行跨数据一致性验证脚本
        run: python3 scripts/validate-cross-routing.py

  goal-schema:
    name: 教练目标 schema 验证(6模板 + ⑤守护 + PIPL合规)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练目标 schema 验证脚本
        run: python3 scripts/validate-goal-schema.py

  effectiveness-metrics:
    name: 教练有效性指标验证(KPI全覆盖 + ⑤守护 + 公式系数)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练有效性指标验证脚本
        run: python3 scripts/validate-effectiveness-metrics.py

  progress-tracker:
    name: 教练进度追踪 schema 验证(三类记录 + PIPL + ⑤守护 + 三模板)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练进度追踪 schema 验证脚本
        run: python3 scripts/validate-progress-tracker.py

  report-template:
    name: 教练报告模板 schema 验证(6类报告 + 四门户访问控制 + ⑤守护)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练报告模板 schema 验证脚本
        run: python3 scripts/validate-report-template.py

  intervention-library:
    name: 教练干预手册验证(17条干预 + 四维度覆盖 + ⑤守护 + 飞轮合规)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练干预手册验证脚本
        run: python3 scripts/validate-intervention-library.py

  onboarding-schema:
    name: 教练入学流程 schema 验证(6阶段 + CAT路由 + ⑤守护 + PIPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练入学流程 schema 验证脚本
        run: python3 scripts/validate-onboarding-schema.py

  coaching-qa-schema:
    name: 教练质量保证 schema 验证(5维度 + 4类评审 + ⑤守护 + 权重归一)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练质量保证 schema 验证脚本
        run: python3 scripts/validate-qa-schema.py

  escalation-protocol:
    name: 教练升级处置协议验证(5等级 + ⑤守护 + PIPL + 紧急时效)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练升级处置协议验证脚本
        run: python3 scripts/validate-escalation-protocol.py

  peer-supervision:
    name: 教练同伴督导 schema 验证(配对规则 + 5维度评分 + ⑤守护 + 六飞轮)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练同伴督导 schema 验证脚本
        run: python3 scripts/validate-peer-supervision.py

  certification-schema:
    name: 教练认证等级 schema 验证(5等级 + ⑤守护递增 + 道层考试 + PIPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练认证等级 schema 验证脚本
        run: python3 scripts/validate-certification-schema.py

  coaching-plan-schema:
    name: 个性化教练计划 schema 验证(MECE诊断 + 七阶 + 六飞轮 + ⑤守护 + PIPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行个性化教练计划 schema 验证脚本
        run: python3 scripts/validate-coaching-plan-schema.py

  parent-engagement:
    name: 家长参与 schema 验证(5类沟通 + 六飞轮 + 七阶 + θ禁止共享 + PIPL第14条)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行家长参与 schema 验证脚本
        run: python3 scripts/validate-parent-engagement.py

  group-session:
    name: 小组教练会话 schema 验证(1:N分组 + gc-stage/bottleneck/flywheel + ⑤守护 + MECE + PIPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行小组教练会话 schema 验证脚本
        run: python3 scripts/validate-group-session.py

  graduation-schema:
    name: 教练毕业结案 schema 验证(3种毕业标准 + ⑤守护 + 七阶 + 六飞轮 + MECE + PIPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练毕业结案 schema 验证脚本
        run: python3 scripts/validate-graduation-schema.py

  dropout-risk-schema:
    name: 教练脱落风险 schema 验证(5指标权重归一 + ⑤守护 + 七阶 + 六飞轮 + MECE + PIPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练脱落风险 schema 验证脚本
        run: python3 scripts/validate-dropout-risk-schema.py

  session-notes-schema:
    name: 教练会话笔记 schema 验证(10必填字段 + ⑤守护 + 七阶 + 六飞轮 + MECE + PIPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练会话笔记 schema 验证脚本
        run: python3 scripts/validate-session-notes-schema.py

  reassessment-trigger-schema:
    name: 教练复测触发 schema 验证(5信号 + ⑤守护 + 七阶 + MECE + 六飞轮 + PIPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练复测触发 schema 验证脚本
        run: python3 scripts/validate-reassessment-trigger-schema.py

  student-profile-schema:
    name: 教练学生档案 schema 验证(7必填字段 + ⑤守护 + 七阶 + MECE + 六飞轮 + PIPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练学生档案 schema 验证脚本
        run: python3 scripts/validate-student-profile-schema.py

  platform-analytics-schema:
    name: 教练平台分析 schema 验证(七阶分布/MECE/六飞轮均值 + ⑤守护 + 趋势 + 最小样本 + PIPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行教练平台分析 schema 验证脚本
        run: python3 scripts/validate-platform-analytics-schema.py
